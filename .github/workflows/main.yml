name: 'Build and publish release'

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-and-package:
    strategy:
      matrix:
        include:
          - platform: 'x86'
            build_configuration: 'Release'
          - platform: 'x64'
            build_configuration: 'Release'
          - platform: 'ARM64'
            build_configuration: 'Release'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout from GitHub
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'

      - name: Install vcpkg
        shell: bash
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg integrate install

      - name: Install dependencies via vcpkg
        run: |
          ./vcpkg/vcpkg install ms-gsl:x86-windows ms-gsl:x64-windows ms-gsl:arm64-windows
          ./vcpkg/vcpkg install boost-pool:x86-windows boost-pool:x64-windows boost-pool:arm64-windows

      - name: Install NuGet CLI
        run: choco install nuget.commandline

      - name: Restore legacy NuGet packages
        shell: pwsh
        run: |
          @(
            'ProxiFyre.Configuration\packages.config',
            'ProxiFyre\packages.config',
            'ProxiFyre.Tests\packages.config'
          ) | ForEach-Object {
            nuget restore $_ -PackagesDirectory packages -NonInteractive
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed for $_ with exit code $LASTEXITCODE."
            }
          }

      - name: Restore pinned installer packages
        shell: pwsh
        run: |
          msbuild ProxiFyreSetupBootstrapper\ProxiFyreSetupBootstrapper.vcxproj `
            -target:Restore `
            -verbosity:minimal `
            -property:RestoreLockedMode=true `
            -property:RestoreConfigFile="${{ github.workspace }}\NuGet.Installer.Config"
          if ($LASTEXITCODE -ne 0) { throw "Setup bootstrapper restore failed with exit code $LASTEXITCODE." }
          msbuild ProxiFyreSetupEngineExtension\ProxiFyreSetupEngineExtension.vcxproj `
            -target:Restore `
            -verbosity:minimal `
            -property:RestoreLockedMode=true `
            -property:RestoreConfigFile="${{ github.workspace }}\NuGet.Installer.Config"
          if ($LASTEXITCODE -ne 0) { throw "Setup engine extension restore failed with exit code $LASTEXITCODE." }
          dotnet restore ProxiFyre.Installer\ProxiFyre.Installer.wixproj --configfile NuGet.Installer.Config --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "WiX MSI restore failed with exit code $LASTEXITCODE." }
          dotnet restore ProxiFyre.Bundle\ProxiFyre.Bundle.wixproj --configfile NuGet.Installer.Config --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "WiX bundle restore failed with exit code $LASTEXITCODE." }

      - name: Parse Version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [xml] $versionProps = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = [string] $versionProps.Project.PropertyGroup.ProxiFyreReleaseVersion
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Directory.Build.props contains invalid release version '$version'."
          }

          if ($env:REF_TYPE -eq 'tag') {
            $expectedTag = "v$version"
            if ($env:REF_NAME -cne $expectedTag) {
              throw "Release tag '$($env:REF_NAME)' must match the repository version '$expectedTag'. Prerelease suffixes cannot be represented safely by the three-part MSI ProductVersion."
            }
            $packageLabel = $env:REF_NAME
          }
          else {
            $packageLabel = 'ci-${{ github.run_id }}'
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_LABEL=$packageLabel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: msbuild socksify.sln -t:rebuild -verbosity:minimal -property:Configuration=Release -property:Platform=${{ matrix.platform }} -property:Version=${{ env.VERSION }} -property:Repository=${{ github.repository }}

      - name: Verify UI high-DPI configuration
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./scripts/Test-UiHighDpiConfiguration.ps1

      - name: Verify UI launcher security diagnostics
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./scripts/Test-UiLauncherSecurityDiagnostics.ps1 -Platform x64

      - name: Run managed tests
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\vstest.console.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($vstest)) {
            throw 'vstest.console.exe was not found in the Visual Studio installation.'
          }
          & $vstest "bin\tests\${{ matrix.platform }}\Release\ProxiFyre.Tests.dll" `
            "/TestAdapterPath:packages\NUnit3TestAdapter.4.6.0\build\net462" `
            "/Platform:${{ matrix.platform }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Managed tests failed with exit code $LASTEXITCODE."
          }

      - name: Verify release payload
        shell: pwsh
        run: |
          $payload = "bin\exe\${{ matrix.platform }}\${{ matrix.build_configuration }}"
          @(
            'ProxiFyre.exe',
            'ProxiFyre.exe.config',
            'ProxiFyreUI.exe',
            'ProxiFyreUI.Managed.dll',
            'ProxiFyreUI.exe.config',
            'ProxiFyre.Configuration.dll',
            'socksify.dll',
            'Newtonsoft.Json.dll',
            'NLog.dll',
            'Topshelf.dll',
            'NLog.config',
            'app-config.sample.json'
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $payload $_) -PathType Leaf)) {
              throw "Required release file '$_' is missing from '$payload'."
            }
          }

      - name: Verify first-party artifacts are unsigned
        shell: pwsh
        run: |
          $payload = "bin\exe\${{ matrix.platform }}\${{ matrix.build_configuration }}"
          $modules = @(
            'ProxiFyre.exe',
            'ProxiFyreUI.exe',
            'ProxiFyreUI.Managed.dll',
            'ProxiFyre.Configuration.dll',
            'socksify.dll'
          ) | ForEach-Object { Join-Path $payload $_ }
          ./scripts/Test-UnsignedArtifacts.ps1 -Path $modules

      - name: Build MSI and prerequisite setup bundle
        shell: pwsh
        run: |
          ./scripts/Build-Installer.ps1 `
            -Platform '${{ matrix.platform }}' `
            -Version '${{ env.VERSION }}' `
            -PayloadDirectory 'bin\exe\${{ matrix.platform }}\${{ matrix.build_configuration }}' `
            -OutputDirectory 'bin\installer\${{ matrix.platform }}\${{ matrix.build_configuration }}' `
            -NoRestore `
            -Force

      - name: Package Release
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'zip'
          filename: 'ProxiFyre-${{ env.PACKAGE_LABEL }}-${{ matrix.platform }}.zip'
          directory: 'bin\\exe\\${{ matrix.platform }}\\${{ matrix.build_configuration }}'
          exclusions: '*.pdb'

      - name: Write archive checksum
        shell: pwsh
        run: |
          $archive = "bin\exe\${{ matrix.platform }}\${{ matrix.build_configuration }}\ProxiFyre-${{ env.PACKAGE_LABEL }}-${{ matrix.platform }}.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$archive.sha256",
            "$hash  $([IO.Path]::GetFileName($archive))`n",
            [Text.UTF8Encoding]::new($false))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifact
          path: |
            bin\exe\${{ matrix.platform }}\${{ matrix.build_configuration }}\ProxiFyre-${{ env.PACKAGE_LABEL }}-${{ matrix.platform }}.zip
            bin\exe\${{ matrix.platform }}\${{ matrix.build_configuration }}\ProxiFyre-${{ env.PACKAGE_LABEL }}-${{ matrix.platform }}.zip.sha256
            bin\installer\${{ matrix.platform }}\${{ matrix.build_configuration }}\ProxiFyre-*.msi
            bin\installer\${{ matrix.platform }}\${{ matrix.build_configuration }}\ProxiFyre-*-setup.exe
            bin\installer\${{ matrix.platform }}\${{ matrix.build_configuration }}\ProxiFyre-*.sha256

  upload-release:
    # Publish only after every architecture produced its ZIP, MSI, online setup,
    # and checksum files, so a failed matrix leg cannot create a partial release.
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout from GitHub
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: 'artifacts'

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'artifacts/**/*.zip,artifacts/**/ProxiFyre-*.msi,artifacts/**/ProxiFyre-*-setup.exe,artifacts/**/*.sha256'
          name: 'ProxiFyre-${{ github.ref_name }}'
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          immutableCreate: true
