name: 'Build and publish release'

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-and-package:
    strategy:
      matrix:
        include:
          - platform: 'x86'
            build_configuration: 'Release'
          - platform: 'x64'
            build_configuration: 'Release'
          - platform: 'ARM64'
            build_configuration: 'Release'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout from GitHub
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'

      - name: Install vcpkg
        shell: bash
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg integrate install

      - name: Install dependencies via vcpkg
        run: |
          ./vcpkg/vcpkg install ms-gsl:x86-windows ms-gsl:x64-windows ms-gsl:arm64-windows
          ./vcpkg/vcpkg install boost-pool:x86-windows boost-pool:x64-windows boost-pool:arm64-windows

      - name: Install NuGet CLI
        run: choco install nuget.commandline

      - name: Restore NuGet Packages
        run: nuget restore socksify.sln

      - name: Parse Version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_VERSION=$(echo "${{ github.ref_name }}" | sed -e 's/^v//')
            if [[ "$RAW_VERSION" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?(\.([0-9]+))?([-+].*)?$ ]]; then
              VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[4]:-0}.${BASH_REMATCH[6]:-0}"
            else
              echo "Tag '${{ github.ref_name }}' does not begin with a valid numeric version." >&2
              exit 1
            fi
            PACKAGE_LABEL="${{ github.ref_name }}"
          else
            VERSION="0.0.0"
            PACKAGE_LABEL="ci-${{ github.run_id }}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PACKAGE_LABEL=${PACKAGE_LABEL}" >> $GITHUB_ENV

      - name: Build
        run: msbuild socksify.sln -t:rebuild -verbosity:minimal -property:Configuration=Release -property:Platform=${{ matrix.platform }} -property:Version=${{ env.VERSION }} -property:Repository=${{ github.repository }}

      - name: Run managed tests
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\vstest.console.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($vstest)) {
            throw 'vstest.console.exe was not found in the Visual Studio installation.'
          }
          & $vstest "bin\tests\${{ matrix.platform }}\Release\ProxiFyre.Tests.dll" `
            "/TestAdapterPath:packages\NUnit3TestAdapter.4.6.0\build\net462" `
            "/Platform:${{ matrix.platform }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Managed tests failed with exit code $LASTEXITCODE."
          }

      - name: Verify release payload
        shell: pwsh
        run: |
          $payload = "bin\exe\${{ matrix.platform }}\${{ matrix.build_configuration }}"
          @(
            'ProxiFyre.exe',
            'ProxiFyre.exe.config',
            'ProxiFyreUI.exe',
            'ProxiFyreUI.exe.config',
            'ProxiFyre.Configuration.dll',
            'socksify.dll',
            'Newtonsoft.Json.dll',
            'NLog.dll',
            'Topshelf.dll',
            'NLog.config',
            'app-config.sample.json'
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $payload $_) -PathType Leaf)) {
              throw "Required release file '$_' is missing from '$payload'."
            }
          }

      - name: Package Release
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'zip'
          filename: 'ProxiFyre-${{ env.PACKAGE_LABEL }}-${{ matrix.platform }}.zip'
          directory: 'bin\\exe\\${{ matrix.platform }}\\${{ matrix.build_configuration }}'
          exclusions: '*.pdb'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifact
          path: 'bin\\exe\\${{ matrix.platform }}\\${{ matrix.build_configuration }}\\ProxiFyre-${{ env.PACKAGE_LABEL }}-${{ matrix.platform }}.zip'

  upload-release:
    # Only publish when EVERY matrix build (x86/x64/ARM64) succeeded. Without this gate the job
    # ran on `always()`, so a single failed platform build would publish a partial release that is
    # missing an architecture's zip -- and `skipIfReleaseExists` then blocks a retry from fixing it.
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout from GitHub
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: 'artifacts'

      - name: Parse Version
        shell: bash
        run: |
          # Strip "v" prefix from tag name 
          VERSION=$(echo ${{ github.ref_name }} | sed -e 's/^v//') 
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'artifacts/**/*.zip'
          name: 'ProxiFyre-${{ github.ref_name }}'
          tag: ${{ github.ref_name }}
          token: ${{ secrets.MY_GITHUB_PAT }}
          skipIfReleaseExists: true
